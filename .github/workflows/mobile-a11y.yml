
name: React Native Accessibility CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  accessibility-tests:
    name: Accessibility Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Accessibility ESLint
        run: npm run lint:a11y

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Accessibility component tests
        run: npm test -- --ci --watch=false

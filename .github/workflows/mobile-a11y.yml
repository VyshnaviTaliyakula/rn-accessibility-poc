

name: React Native Accessibility CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  accessibility-tests:
    name: ESLint, TypeScript & Jest
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Accessibility ESLint
        run: npm run lint:a11y

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Accessibility component tests
        run: npm test -- --ci --watch=false

  android-accessibility:
    name: Android Native Accessibility (Espresso)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          # Match Expo 58 / React Native 0.88 compileSdk=37 and buildTools=37.0.0.
          # The SDK repository names this platform android-37.0, not android-37.
          # This compile SDK is independent of the API 36 emulator below.
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -f "$ANDROID_HOME/build-tools/37.0.0/source.properties"
          test -f "$ANDROID_HOME/ndk/27.1.12297006/source.properties"

      - name: Generate Android project and accessibility tests
        run: npx expo prebuild --platform android --no-install

      - name: Enable Gradle wrapper
        run: chmod +x android/gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Accessibility Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: npm run test:android -- -PreactNativeArchitectures=x86_64

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-accessibility-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  ios-accessibility:
    name: iOS Native Accessibility (XCTest)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Verify Xcode schemes
        run: |
          xcodebuild -list \
            -workspace ios/rnaccessibilitypoc.xcworkspace

      - name: Run iOS Accessibility Tests
        run: |
          set -o pipefail

          xcodebuild test \
            -workspace ios/rnaccessibilitypoc.xcworkspace \
            -scheme rnaccessibilitypoc \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -derivedDataPath ios/DerivedData \
            -resultBundlePath ios/AccessibilityResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Accessibility Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-accessibility-reports
          path: ios/AccessibilityResults.xcresult
          if-no-files-found: ignore

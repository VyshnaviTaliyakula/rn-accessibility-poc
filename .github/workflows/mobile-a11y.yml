

name: React Native Accessibility CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  accessibility-tests:
    name: ESLint, TypeScript & Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Accessibility ESLint
        run: npm run lint:a11y

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Accessibility component tests
        run: npm test -- --ci --watch=false

  android-accessibility:
    name: Android Native Accessibility (Espresso)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"

      - name: Enable Gradle wrapper
        run: chmod +x android/gradlew

      - name: Run Android Accessibility Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            cd android
            ./gradlew connectedDebugAndroidTest --console=plain

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-accessibility-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

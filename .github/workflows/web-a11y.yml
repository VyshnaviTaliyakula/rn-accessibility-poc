name: Web Accessibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-accessibility:
    name: Web accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:a11y

      - name: Typecheck
        run: npm run typecheck

      - name: DOM accessibility tests
        run: npm run test:web -- --ci --runInBand

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Export web app
        id: export
        run: npm run build:web

      - name: Browser accessibility tests
        run: npm run test:web:e2e

      - name: Lighthouse accessibility audit
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:web:lighthouse

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-accessibility-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
            lighthouse-report/
          if-no-files-found: ignore
          retention-days: 14
